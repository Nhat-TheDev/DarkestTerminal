name: Verify Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides whether this run is allowed to publish. A tag push only qualifies
  # once the tagged commit is actually reachable from origin/main — i.e. the
  # PR that introduced it has already been merged. This prevents a `v*` tag
  # pushed from an unmerged branch (e.g. while a release PR is still open)
  # from publishing to npm.
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if git merge-base --is-ancestor "${{ github.sha }}" FETCH_HEAD; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag ${{ github.ref_name }} points to a commit that is not on origin/main. Only tag a commit that has already been merged into main. Refusing to publish."
            exit 1
          fi

  verify:
    needs: gate
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            outfile: npm/darwin-arm64/darkest-terminal
          - os: macos-15-intel
            platform: darwin-x64
            outfile: npm/darwin-x64/darkest-terminal
          - os: windows-latest
            platform: win32-x64
            outfile: npm/win32-x64/darkest-terminal.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build standalone binary
        shell: bash
        run: bun build ./src/main.ts --compile --outfile "${{ matrix.outfile }}"

      - name: Smoke test binary (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "${{ matrix.outfile }}" < /dev/null > smoke.log 2>&1 &
          pid=$!
          sleep 2
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test -s smoke.log

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "${{ matrix.outfile }}" -RedirectStandardOutput smoke.log -RedirectStandardError smoke-err.log -PassThru
          Start-Sleep -Seconds 2
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ((Get-Item smoke.log).Length -eq 0) { throw "binary produced no output" }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkest-terminal-${{ matrix.platform }}
          path: ${{ matrix.outfile }}

      - name: Publish platform package
        if: needs.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./npm/${{ matrix.platform }}/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "error: tag v$TAG_VERSION does not match npm/${{ matrix.platform }}/package.json version $PKG_VERSION" >&2
            exit 1
          fi
          npm install -g npm@latest
          npm publish "./npm/${{ matrix.platform }}" --access public

  publish-main:
    needs: [gate, verify]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "error: tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish main package
        run: |
          npm install -g npm@latest
          npm publish . --access public
