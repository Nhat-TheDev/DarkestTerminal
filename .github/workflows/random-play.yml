name: Random Play

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: random-play-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fixed seeds, so a red check means the code changed, not the dice.
      - id: check
        continue-on-error: true
        run: bun run curve --check --out curve-head
      - name: Measure the base branch
        continue-on-error: true
        run: |
          if [ -f base/tools/curve/run.ts ]; then
            cd base && bun install --frozen-lockfile && bun run curve --out ../curve-base
          fi
      - name: Comment the curve on the pull request
        if: always() && hashFiles('curve-head/curve.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bun run tools/curve/comment.ts --head curve-head/curve.json --base curve-base/curve.json \
            --head-label "\`${HEAD_SHA::7}\`" --base-label "\`${BASE_SHA::7}\`" --out curve-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file curve-comment.md --edit-last --create-if-none
        shell: bash
      - if: steps.check.outcome == 'failure'
        run: exit 1

  random-play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Each kind of failure in the log carries a command that replays it locally with the colour report.
      - run: bun run random-play --runs 5 --max-steps 5000 --report none
